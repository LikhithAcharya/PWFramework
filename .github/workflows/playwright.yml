name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Allure results (shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 30

  allure-report:
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o test-results/allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: test-results/allure-report
          retention-days: 30

      - name: Set report timestamp
        if: github.event_name == 'push'
        id: ts
        run: echo "stamp=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Commit report into allure-results
        if: github.event_name == 'push'
        run: |
          mkdir -p "allure-results/${{ steps.ts.outputs.stamp }}"
          cp -r test-results/allure-report/. "allure-results/${{ steps.ts.outputs.stamp }}/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "allure-results/${{ steps.ts.outputs.stamp }}"
          git commit -m "Add Allure report ${{ steps.ts.outputs.stamp }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
