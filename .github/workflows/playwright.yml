name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Allure results (shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 30

  allure-report:
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: npx allure generate allure-results --single-file --clean -o test-results/allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: test-results/allure-report
          retention-days: 30

      - name: Set report timestamp
        if: github.event_name == 'push'
        id: ts
        run: echo "stamp=$(TZ='Asia/Kolkata' date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Add report to history and keep last 10
        if: github.event_name == 'push'
        run: |
          mkdir -p "test-results/allure-history/${{ steps.ts.outputs.stamp }}"
          cp test-results/allure-report/index.html "test-results/allure-history/${{ steps.ts.outputs.stamp }}/index.html"
          cd test-results/allure-history
          ls -1d */ | sort | head -n -10 | xargs -r rm -rf --

      - name: Commit and push report history
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A test-results/allure-history
          git commit -m "Add Allure report ${{ steps.ts.outputs.stamp }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
